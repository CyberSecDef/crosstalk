[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crosstalk"
version = "0.1.0"
description = "Evidence-grounded multi-vendor podcast generator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1", "httpx>=0.28,<1", "python-dotenv>=1,<2", "PyYAML>=6,<7", "trafilatura>=2,<3", "jsonschema>=4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
crosstalk = "crosstalk.cli:app"

[tool.setuptools.packages.find]
include = ["crosstalk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
